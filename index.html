<title>রকির AI স্টাডি গাইডার · HSC 2027</title>
<style>
:root{
  --bg:#070b14;--card:rgba(16,22,40,.72);--stroke:rgba(255,255,255,.1);
  --text:#eef2ff;--muted:#8b9bb4;--accent:#818cf8;--cyan:#22d3ee;--gold:#f59e0b;
  --gold2:#fde047;--ok:#34d399;--danger:#f87171;--pink:#f472b6;
  --nav-h:74px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Nirmala UI","Kalpurush",system-ui,sans-serif;
  overflow-x:hidden}
body{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px);padding-top:env(safe-area-inset-top,0px)}
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:float 18s ease-in-out infinite}
.orb.a{width:320px;height:320px;background:#4f46e5;top:-80px;left:-80px}
.orb.b{width:280px;height:280px;background:#0891b2;bottom:10%;right:-90px;animation-delay:-6s}
.orb.c{width:220px;height:220px;background:#7c3aed;bottom:30%;left:20%;animation-delay:-11s;opacity:.28}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-24px) scale(1.08)}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 14px 20px}
@media(min-width:900px){#app{max-width:980px;padding:18px 22px}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#22d3ee);display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 8px 24px rgba(99,102,241,.4)}
.brand h1{font-size:15.5px;font-weight:800;letter-spacing:.2px;line-height:1.2}
.brand p{font-size:11px;color:var(--muted)}
.install-btn{border:0;cursor:pointer;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;padding:9px 12px;border-radius:12px;white-space:nowrap;box-shadow:0 6px 18px rgba(79,70,229,.35)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--stroke);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.28)}
.page.anim{animation:up .32s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cd-wrap{padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.cd-wrap::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;background:radial-gradient(circle,rgba(253,224,71,.18),transparent 70%)}
.cd-label{font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd-cell{text-align:center;background:rgba(0,0,0,.28);border-radius:14px;padding:10px 4px;border:1px solid rgba(255,255,255,.06)}
.cd-num{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.cd-unit{font-size:10px;color:var(--muted);margin-top:3px}
.quote-banner{padding:14px 16px;margin-bottom:12px;cursor:pointer;position:relative}
.quote-banner q{font-size:13.5px;line-height:1.65;font-style:italic;color:#dbe4ff;quotes:none;transition:opacity .34s ease}
.quote-banner .who{margin-top:8px;font-size:11px;color:var(--gold);font-weight:700;transition:opacity .34s ease}
.quote-banner .hint{margin-top:4px;font-size:10px;color:var(--muted);transition:opacity .34s ease}
.quote-banner.q-hide q,.quote-banner.q-hide .who,.quote-banner.q-hide .hint{opacity:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;color:#c7d2fe}
.stat span{font-size:10.5px;color:var(--muted);line-height:1.3}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 8px}
.section-h h2{font-size:14px;font-weight:800}
.chip{font-size:10.5px;padding:4px 9px;border-radius:999px;background:rgba(129,140,248,.15);color:#c7d2fe;border:1px solid rgba(129,140,248,.25)}
.chip.gold{background:rgba(245,158,11,.15);color:#fde047;border-color:rgba(245,158,11,.3)}
.chip.ok{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:rgba(52,211,153,.25)}
.sub-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sub-card{padding:12px}
.sub-card .k{font-size:10px;color:var(--muted)}
.sub-card .n{font-size:13px;font-weight:800;margin:4px 0 8px;line-height:1.35}
.bar-bg{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.bar-fg{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--cyan));width:0;transition:width .5s ease}
.sess{padding:12px 14px;margin-bottom:8px}
.sess-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sess-meta{font-size:10.5px;color:var(--cyan);font-weight:700}
.sess h3{font-size:13px;margin:3px 0 2px}
.sess .ch-t{font-size:13.5px;line-height:1.45;color:#e0e7ff}
.done-btn{border:0;cursor:pointer;background:linear-gradient(135deg,#059669,#34d399);color:#052e1c;font-weight:800;font-size:11px;padding:8px 10px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.done-btn.off{background:rgba(255,255,255,.08);color:var(--muted)}
.pace{padding:12px 14px;margin-top:4px;font-size:12.5px;line-height:1.55;color:#cbd5e1}
.routine-item{display:flex;gap:10px;padding:12px;margin-bottom:8px;align-items:flex-start}
.routine-item.now{border-color:rgba(34,211,238,.45);box-shadow:0 0 0 1px rgba(34,211,238,.25),0 8px 28px rgba(34,211,238,.12)}
.routine-item.done{opacity:.62}
.check{width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.25);flex-shrink:0;margin-top:2px;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.04)}
.check.on{background:linear-gradient(135deg,#059669,#34d399);border-color:transparent;color:#052e1c;font-weight:900}
.rt-time{font-size:11px;color:var(--cyan);font-weight:700}
.rt-title{font-size:13.5px;font-weight:700;line-height:1.4;margin:2px 0}
.rt-sub{font-size:11.5px;color:var(--muted);line-height:1.45}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;margin-top:4px;font-weight:700}
.tag.hsc{background:rgba(129,140,248,.18);color:#c7d2fe}
.tag.code{background:rgba(52,211,153,.15);color:#6ee7b7}
.tag.en{background:rgba(244,114,182,.15);color:#f9a8d4}
.tag.life{background:rgba(251,191,36,.12);color:#fde68a}
.acc{margin-bottom:8px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.acc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.acc-h b{flex:1;font-size:13.5px;line-height:1.3}
.acc-h em{font-style:normal;font-size:11px;color:var(--muted)}
.acc-b{display:none;padding:0 10px 12px}
.acc.open .acc-b{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:8px 6px;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px;line-height:1.45;cursor:pointer}
.ch-row .mini{width:18px;height:18px;border-radius:5px;border:2px solid rgba(255,255,255,.2);flex-shrink:0;margin-top:1px;display:grid;place-items:center;font-size:11px}
.ch-row.on{color:#86efac}
.ch-row.on .mini{background:#34d399;border-color:transparent;color:#052e1c}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.3);color:var(--text);margin-bottom:10px;font-size:13.5px;outline:none}
.timer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tbtn{padding:10px 6px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--text);border-radius:14px;cursor:pointer;font-size:11.5px;font-weight:700;text-align:center}
.tbtn.on{background:linear-gradient(135deg,#4f46e5,#6366f1);border-color:transparent;box-shadow:0 6px 20px rgba(79,70,229,.4)}
.tbtn small{display:block;font-weight:600;color:var(--muted);font-size:10px;margin-top:3px}
.tbtn.on small{color:#c7d2fe}
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:18px 10px 10px}
.ring-box{position:relative;width:220px;height:220px}
.ring-wrap svg{width:220px;height:220px;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.time-big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.t-actions{display:flex;gap:8px;justify-content:center;margin:12px 0 8px;flex-wrap:wrap}
.btn{border:0;cursor:pointer;border-radius:12px;padding:11px 18px;font-weight:800;font-size:13px}
.btn.go{background:linear-gradient(135deg,#4f46e5,#22d3ee);color:#fff}
.btn.pause{background:rgba(251,191,36,.2);color:#fde047}
.btn.reset{background:rgba(255,255,255,.08);color:var(--text)}
.btn.save{background:linear-gradient(135deg,#f59e0b,#fde047);color:#3b2606}
.hours-box{padding:14px;margin-top:8px}
.hours-box input{width:90px;padding:8px 10px;border-radius:10px;border:1px solid var(--stroke);background:rgba(0,0,0,.35);color:#fff;font-size:16px;font-weight:700}
.chart-card{padding:14px;margin-bottom:12px}
.chart-card h3{font-size:13px;margin-bottom:10px}
.chart-scroll{overflow-x:auto;padding-bottom:4px}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;min-width:100%}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:28px}
.col .val{font-size:9px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.col .bar{width:70%;max-width:28px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#818cf8,#4338ca);min-height:3px;transition:height .4s ease}
.col.fri .bar{background:linear-gradient(180deg,#fde047,#f59e0b);box-shadow:0 0 14px rgba(245,158,11,.75)}
.col .lbl{font-size:9px;color:var(--muted);margin-top:5px;text-align:center;line-height:1.2}
.col.fri .lbl{color:#fde047;font-weight:700}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:10px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 10px calc(8px + var(--safe-b));background:linear-gradient(180deg,transparent,rgba(7,11,20,.92) 30%);pointer-events:none}
.nav-in{pointer-events:auto;display:flex;width:100%;max-width:560px;background:rgba(12,16,32,.88);backdrop-filter:blur(16px);border:1px solid var(--stroke);border-radius:20px;padding:6px;box-shadow:0 -8px 40px rgba(0,0,0,.45)}
.nav-btn{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 2px 6px;border-radius:14px;cursor:pointer;font-size:10px;font-weight:700}
.nav-btn svg{display:block;margin:0 auto 3px}
.nav-btn.on{color:#fff;background:rgba(129,140,248,.18)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translateX(-50%) translateY(20px);background:#0f172a;border:1px solid rgba(52,211,153,.4);color:#d1fae5;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:50;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.goal{padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.goal b{color:var(--gold2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px;margin-bottom:12px}
.wday{text-align:center;padding:8px 2px;border-radius:10px;font-size:10px;background:rgba(255,255,255,.04);border:1px solid transparent}
.wday.on{border-color:rgba(129,140,248,.5);background:rgba(129,140,248,.18)}
.wday.fri{color:#fde047}
.wday b{display:block;font-size:11px;margin-bottom:3px}
.prog-ring-sm{width:44px;height:44px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
hr.sep{border:0;border-top:1px solid rgba(255,255,255,.06);margin:10px 0}
.manual-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.linkish{background:none;border:0;color:var(--accent);font-size:12px;cursor:pointer;font-weight:700}
@media(min-width:900px){
  .desk{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;align-items:start}
  .nav-in{max-width:980px}
}
</style>
</head>

function todayISO(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function pad(n){ return String(n).padStart(2,"0"); }
function nowMins(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function currentStep(){
  const m=nowMins();
  if(m>=1380 || m<300) return -1;
  for(let i=0;i<ROUTINE.length;i++){ if(m>=ROUTINE[i].from && m<ROUTINE[i].to) return i; }
  return -1;
}
function totalChapters(){ return SUB_ORDER.reduce((s,id)=>s+SUBJECTS[id].chapters.length,0); }
function doneCount(sid){
  if(sid){ return SUBJECTS[sid].chapters.filter(c=>chapters[c.id]).length; }
  return Object.keys(chapters).filter(k=>chapters[k]).length;
}
function pct(sid){
  const tot = SUBJECTS[sid].chapters.length;
  return tot? doneCount(sid)/tot : 0;
}
function weakest(exclude){
  let min=2, id=SUB_ORDER[0];
  SUB_ORDER.forEach(s=>{
    if(exclude && exclude.includes(s)) return;
    const p=pct(s);
    if(p<min){ min=p; id=s; }
  });
  return id;
}
function todayPlan(){
  const dow=new Date().getDay();
  const w=WEEKLY[dow];
  const m=w.m;
  const a = w.a==="AUTO" ? weakest([m]) : w.a;
  return { dow, m, a, friday: dow===5, note:w.note };
}
function firstOpen(sid, n){
  const list=[];
  for(const c of SUBJECTS[sid].chapters){
    if(!chapters[c.id]) list.push(c);
    if(list.length>=n) break;
  }
  return list;
}
function remainingDays(){

function fmtRemain(){
  let ms=remainingDays();
  const d=Math.floor(ms/86400000); ms%=86400000;
  const h=Math.floor(ms/3600000); ms%=3600000;
  const m=Math.floor(ms/60000); ms%=60000;
  const s=Math.floor(ms/1000);
  return {d,h,m,s};
}

function todayHoursAuto(){

}
function displayHours(date){

function logSession(sid, on){
  const t=todayISO();
  if(!logged[t]) logged[t]={};

  if(!sess) return;
  if(on){ logged[t][sid]=true; }
  else { delete logged[t][sid]; }
  if(manual[t]==null) hours[t]=todayHoursAuto();
  else todayHoursAuto();
  persistHr();
}

function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(); const g=ctx.createGain();
    o.type="sine"; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.8);
    o.start(); o.stop(ctx.currentTime+0.8);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,80,200,80,400]);
}

function selectSession(id){
  const s=SESSIONS.find(x=>x.id===id);
  timer.sid=id; timer.total=s.mins*60; timer.remain=s.mins*60; timer.running=false;
  render();
}
function startTimer(){
  if(timer.remain<=0){
    const s=SESSIONS.find(x=>x.id===timer.sid);
    timer.remain=s.mins*60; timer.total=s.mins*60;
  }
  timer.running=true; timer.last=Date.now();
  if(!timerInt) timerInt=setInterval(tick, 250);
  render();
}
function pauseTimer(){ timer.running=false; render(); }
function resetTimer(){
  const s=SESSIONS.find(x=>x.id===timer.sid);
  timer.running=false; timer.remain=s.mins*60; timer.total=s.mins*60;
  render();
}
function savePartial(){
  const elapsed = Math.max(0, timer.total - timer.remain);
  if(elapsed < 60){
    toast("⏳ অন্তত ১ মিনিট পড়ার পর সেভ করো");
    return;
  }
  const addH = elapsed/3600;
  const t = todayISO();
  partials[t] = Math.round(((partials[t]||0) + addH)*100)/100;
  if(manual[t]!=null && manual[t]!==""){
    manual[t] = Math.round((Number(manual[t]) + addH)*100)/100;
  }
  persistHr();
  const sess = SESSIONS.find(s=>s.id===timer.sid);
  const wasRunning = timer.running;
  timer.running = false;
  if(timer.remain > 0){
    timer.total = timer.remain;
  } else {
    timer.total = sess.mins*60;
    timer.remain = sess.mins*60;
  }
  if(!routine[t]) routine[t]={};
  toast("💾 "+addH.toFixed(2)+" ঘণ্টা যোগ হলো ("+sess.name+") · আজ মোট "+displayHours(t)+" ঘণ্টা"+(wasRunning?"":""));
  render();
}

function tick(){
  if(!timer.running) return;
  const now=Date.now();
  const dt=Math.floor((now-timer.last)/1000);
  if(dt<=0) return;
  timer.last+=dt*1000;
  timer.remain=Math.max(0, timer.remain-dt);
  if(timer.remain<=0){
    timer.running=false;
    logSession(timer.sid, true);
    const t=todayISO();
    const sess=SESSIONS.find(s=>s.id===timer.sid);
    if(!routine[t]) routine[t]={};
    routine[t][sess.step]=true;
    persistRt();
    beep();
    toast("⏰ "+sess.name+" শেষ! "+sess.hrs+" ঘণ্টা লগ হয়েছে");
    render();
  } else {
    const el=document.getElementById("timeBig");
    const ring=document.getElementById("ringFg");
    if(el) el.textContent=fmtTime(timer.remain);
    if(ring){
      const r=96, circ=2*Math.PI*r;
      const p=timer.remain/timer.total;
      ring.style.strokeDashoffset = String(circ*(1-p));
    }
  }
}

    const tagName={hsc:"HSC পড়া",code:"কোডিং",en:"স্পোকেন ইংলিশ",life:"লাইফ"}[r.tag];
    html+=`<div class="glass routine-item ${on?"done":""} ${isNow?"now":""}" data-act="rt" data-i="${i}">
      <div class="check ${on?"on":""}">${on?"✓":""}</div>
      <div style="flex:1">
        <div class="rt-time">${r.t} · ${r.d}${isNow?' · <span style="color:#22d3ee">● এখন</span>':""}${r.hrs?` · +${r.hrs} ঘণ্টা`:""}</div>
        <div class="rt-title">${r.title}</div>
        <div class="rt-sub">${r.sub}</div>
        <span class="tag ${r.tag}">${tagName}</span>
      </div>
    </div>`;
  });
  return html;
}

function renderSyllabus(){
  const tot=totalChapters(), done=doneCount();
  let html=`<div class="section-h"><h2>📚 সিলেবাস ট্র্যাকার · ১৩ পত্র</h2><span class="chip" id="syChip">${done}/${tot}</span></div>
  <input class="search" id="sySearch" placeholder="অধ্যায় খুঁজুন..." value="${syFilter.replace(/"/g,"&quot;")}">`;
  return html+`<div id="syListContainer">`+renderSyList()+`</div><div style="margin-top:10px;text-align:center"><button class="linkish" data-act="reset">⚠ সব অগ্রগতি রিসেট</button></div>`;
}
function renderSyList(){
  const q=syFilter.trim().toLowerCase();
  let html="";
  SUB_ORDER.forEach(id=>{
    const s=SUBJECTS[id];
    const d=doneCount(id), n=s.chapters.length, p=Math.round(d/n*100);
    const open=openSub===id;
    let rows="";
    s.chapters.forEach((c,idx)=>{
      if(q && c.t.toLowerCase().indexOf(q)===-1) return;
      const on=!!chapters[c.id];
      rows+=`<div class="ch-row ${on?"on":""}" data-act="ch" data-id="${c.id}"><div class="mini">${on?"✓":(idx+1)}</div><div>${c.t}</div></div>`;
    });
    if(q && !rows && s.bn.toLowerCase().indexOf(q)===-1) return;
    html+=`<div class="glass acc ${open||q?"open":""}">
      <div class="acc-h" data-act="acc" data-id="${id}">
        <span class="acc-dot" style="background:${s.color}"></span>
        <b>${s.bn}</b>
        ${ringSVG(d/n, s.color)}
        <em>${d}/${n} · ${p}%</em>
      </div>
      <div class="acc-b">${rows||'<div class="small muted" style="padding:8px">কিছু মেলেনি</div>'}</div>
    </div>`;
  });
  if(!html) html=`<div class="glass" style="padding:16px;text-align:center"><span class="muted">কিছু মেলেনি — অন্য শব্দ দিয়ে খুঁজুন</span></div>`;
  return html;
}

function renderTimer(){
  const t=todayISO();
  const shown=displayHours(t);
  const auto=todayHoursAuto();
  const pt=Number(partials[t]||0);
  const s=SESSIONS.find(x=>x.id===timer.sid);
  const r=96, circ=2*Math.PI*r;
  const p=timer.total? timer.remain/timer.total : 0;
  const elapsed=Math.max(0, timer.total-timer.remain);
  const elapsedTxt = elapsed>=60 ? (elapsed/3600).toFixed(2)+" ঘণ্টা" : (elapsed? elapsed+" সেকেন্ড":"শুরু হয়নি");
  const btns=SESSIONS.map(x=>`<button class="tbtn ${timer.sid===x.id?"on":""}" data-act="selsess" data-id="${x.id}">${x.name}<small>${x.mins} মিনিট</small></button>`).join("");
  return `<div class="section-h"><h2>⏱ মাল্টি-সেশন টাইমার</h2><span class="chip">আজ ${shown} ঘণ্টা</span></div>
  <div class="timer-grid">${btns}</div>
  <div class="glass ring-wrap">
    <div class="ring-box">
    <svg viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="12"/>
      <circle id="ringFg" cx="110" cy="110" r="${r}" fill="none" stroke="url(#tg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-p)}" transform="rotate(-90 110 110)"/>
      <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs>
    </svg>
    <div class="ring-center">
      <div class="time-big" id="timeBig">${fmtTime(timer.remain)}</div>
      <div class="small muted">${s.name} · ${s.hrs} ঘণ্টা লগ হবে</div>
    </div>
    </div>
    <div class="t-actions">
      ${timer.running?`<button class="btn pause" data-act="pause">⏸ পজ</button>`:`<button class="btn go" data-act="start">▶ স্টার্ট</button>`}
      <button class="btn reset" data-act="resetT">↺ রিসেট</button>
      <button class="btn save" data-act="savepart">💾 যতটুকু পড়েছি সেভ করো</button>
    </div>
    <div class="small muted" style="margin-top:4px">চলমান সেশনে অতিবাহিত: <b style="color:#fde047">${elapsedTxt}</b></div>
  </div>
  <div class="glass hours-box">
    <div class="row-between"><b>আজকের পড়ার ঘণ্টা</b><span class="chip">${shown} hrs</span></div>
    <div class="small muted" style="margin-top:6px">অটো লগ (সেশন টিক/টাইমার): ${auto} ঘণ্টা + পার্শিয়াল সেভ: ${pt} ঘণ্টা = <b style="color:#a5b4fc">${(auto+pt).toFixed(2)} ঘণ্টা</b>। ম্যানুয়ালি সেট করলে সেটাই চার্টে যাবে।</div>
    <div class="manual-row">
      <input id="hrIn" type="number" min="0" max="24" step="0.5" value="${manual[t]!=null?manual[t]:shown}">
      <button class="btn go" data-act="savehr">ঘণ্টা সেভ</button>
      <button class="linkish" data-act="clearmn">অটোতে ফিরে যাও</button>
    </div>
  </div>`;
}

function renderAnalytics(){
  const d7=[], d30=[];
  for(let i=6;i>=0;i--){
    const iso=dateOffset(i);
    const dt=new Date(iso+"T12:00:00");
    d7.push({h:displayHours(iso), fri:isFri(iso), lbl:DAYS_SHORT[dt.getDay()]});
  }
  for(let i=29;i>=0;i--){
    const iso=dateOffset(i);
    const dt=new Date(iso+"T12:00:00");
    d30.push({h:displayHours(iso), fri:isFri(iso), lbl:String(dt.getDate())});
  }
  const last7=d7.reduce((s,x)=>s+x.h,0);
  const last30=d30.reduce((s,x)=>s+x.h,0);
  const avg7=last7/7, avg30=last30/30;
  let streak=0;
  for(let i=0;i<400;i++){
    const iso=dateOffset(i);
    if(displayHours(iso)>0) streak++; else { if(i>0) break; }
  }
  const tot=totalChapters(), done=doneCount();
  let subRows="";
  SUB_ORDER.forEach(id=>{
    const s=SUBJECTS[id]; const d=doneCount(id); const n=s.chapters.length;
    subRows+=`<div style="margin:8px 0"><div class="row-between small"><span style="color:${s.color};font-weight:700">${s.bn}</span><span class="muted">${d}/${n}</span></div>
    <div class="bar-bg"><div class="bar-fg" style="width:${Math.round(d/n*100)}%;background:${s.color}"></div></div></div>`;
  });
  return `
  <div class="stats">
    <div class="glass stat"><b>${avg7.toFixed(1)}</b><span>৭ দিনের গড় ঘণ্টা</span></div>
    <div class="glass stat"><b>${avg30.toFixed(1)}</b><span>৩০ দিনের গড়</span></div>
    <div class="glass stat"><b>${streak}</b><span>স্ট্রিক (দিন)</span></div>
  </div>
  <div class="glass chart-card">
    <h3>📊 গত ৭ দিনের পড়াশোনা</h3>
    ${renderChart(d7)}
    <div class="legend"><span><i class="dot" style="background:#818cf8"></i>সাধারণ দিন</span><span><i class="dot" style="background:#f59e0b"></i>শুক্রবার ★ রিভিশন/মডেল টেস্ট</span></div>
  </div>
  <div class="glass chart-card">
    <h3>📈 গত ৩০ দিন</h3>
    ${renderChart(d30)}
    <div class="small muted" style="margin-top:8px">মোট ${last30.toFixed(1)} ঘণ্টা · শুক্রবারগুলো সোনালি বারে চিহ্নিত</div>
  </div>
  <div class="glass" style="padding:14px">
    <div class="section-h" style="margin-top:0"><h2>পত্রভিত্তিক অগ্রগতি</h2><span class="chip">${Math.round(done/tot*100)}%</span></div>
    ${subRows}
  </div>
  <div class="glass quote-banner" style="margin-top:12px" data-act="nextq">
    <q>${QUOTES[quoteIdx%QUOTES.length].q}</q>
    <div class="who">— ${QUOTES[quoteIdx%QUOTES.length].w}</div>
    <div class="hint">ট্যাপ করো পরের উক্তি</div>
  </div>`;
}

function navBar(){
  const items=[["home","হোম","home"],["routine","রুটিন","list"],["syllabus","সিলেবাস","book"],["timer","টাইমার","timer"],["analytics","চার্ট","chart"]];
  return `<nav class="nav"><div class="nav-in">${items.map(i=>`<button class="nav-btn ${page===i[0]?"on":""}" data-act="nav" data-p="${i[0]}">${svgI(i[2])}${i[1]}</button>`).join("")}</div></nav>`;
}

function render(animate){
  const pages={home:renderHome, routine:renderRoutine, syllabus:renderSyllabus, timer:renderTimer, analytics:renderAnalytics};
  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="logo">র</div>
        <div><h1>রকির AI স্টাডি গাইডার</h1><p>HSC 2027 · মানবিক · বগুড়া</p></div>
      </div>
      <button class="install-btn" data-act="install">📲 অ্যাপ ইন্সটল</button>
    </div>
    <div class="page ${animate?"anim":""}">${pages[page]()}</div>
    ${navBar()}`;
  const sy=document.getElementById("sySearch");
  if(sy){
    sy.addEventListener("input", e=>{
      syFilter=e.target.value;
      if(!openSub) openSub="eng1";
      const box=document.getElementById("syListContainer");
      if(box) box.innerHTML=renderSyList();
    });
    sy.addEventListener("keydown", e=>{ if(e.key==="Escape"){ syFilter=""; sy.value=""; const box=document.getElementById("syListContainer"); if(box) box.innerHTML=renderSyList(); } });
  }
}

document.getElementById("app").addEventListener("click", e=>{
  const b=e.target.closest("[data-act]");
  if(!b) return;
  const act=b.dataset.act;
  if(act==="nav"){ page=b.dataset.p; render(true); }
  else if(act==="donech") markChapter(b.dataset.id, true);
  else if(act==="ch"){ toggleChapter(b.dataset.id, true); refreshSyList(); }
  else if(act==="rt") toggleRoutine(Number(b.dataset.i));
  else if(act==="acc"){
    openSub = openSub===b.dataset.id? null : b.dataset.id;
    refreshSyList();
  }
  else if(act==="nextq"){ quoteIdx=(quoteIdx+1)%QUOTES.length; updateQuoteDOM(); }
  else if(act==="selsess") selectSession(b.dataset.id);
  else if(act==="savepart") savePartial();
  else if(act==="start") startTimer();
  else if(act==="pause") pauseTimer();
  else if(act==="resetT") resetTimer();
  else if(act==="savehr"){
    const v=document.getElementById("hrIn").value;
    const t=todayISO();
    manual[t]=Number(v); persistHr(); toast("আজকের ঘণ্টা সেভ হয়েছে: "+v); render();
  }
  else if(act==="clearmn"){ delete manual[todayISO()]; persistHr(); render(); }
  else if(act==="install") installApp();
  else if(act==="reset"){
    if(confirm("সব অধ্যায়, রুটিন ও ঘণ্টার ডেটা মুছে যাবে। নিশ্চিত?")){
      chapters={}; routine={}; hours={}; logged={}; manual={}; partials={};
      persistCh(); persistRt(); persistHr(); toast("রিসেট সম্পন্ন"); render();
    }
  }
});

setInterval(()=>{
  const r=fmtRemain();
  const d=document.getElementById("cdD");
  if(d){ d.textContent=r.d; document.getElementById("cdH").textContent=pad(r.h); document.getElementById("cdM").textContent=pad(r.m); document.getElementById("cdS").textContent=pad(r.s); }
},1000);
setInterval(()=>{ quoteIdx=(quoteIdx+1)%QUOTES.length; updateQuoteDOM(); }, 14000);

function generateIcon(size){
  const c=document.createElement("canvas"); c.width=c.height=size;
  const ctx=c.getContext("2d");
  const g=ctx.createLinearGradient(0,0,size,size);
  g.addColorStop(0,"#4338ca"); g.addColorStop(1,"#0891b2");
  ctx.fillStyle=g;
  const r=size*0.22;
  ctx.beginPath();
  ctx.moveTo(r,0); ctx.arcTo(size,0,size,size,r); ctx.arcTo(size,size,0,size,r); ctx.arcTo(0,size,0,0,r); ctx.arcTo(0,0,size,0,r);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=`800 ${size*0.42}px system-ui,sans-serif`;
  ctx.fillText("R", size/2, size/2 - size*0.04);
  ctx.font=`700 ${size*0.12}px system-ui`;
  ctx.fillStyle="#c7d2fe";
  ctx.fillText("HSC 27", size/2, size/2 + size*0.28);
  return c.toDataURL("image/png");
}

async function setupPWA(){
  const icon192=generateIcon(192), icon512=generateIcon(512);
  const manifest={
    name:"রকির AI স্টাডি গাইডার",
    short_name:"Rocky HSC",
    description:"HSC 2027 Humanities study guider & analytics for Rocky, Bogura.",
    start_url:"./",
    scope:"./",
    display:"standalone",
    orientation:"portrait",
    background_color:"#070b14",
    theme_color:"#4f46e5",
    lang:"bn-BD",
    icons:[
      {src:icon192,sizes:"192x192",type:"image/png",purpose:"any maskable"},
      {src:icon512,sizes:"512x512",type:"image/png",purpose:"any maskable"}
    ]
  };
  const mUrl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"}));
  const link=document.createElement("link"); link.rel="manifest"; link.href=mUrl; document.head.appendChild(link);
  const apple=document.createElement("link"); apple.rel="apple-touch-icon"; apple.href=icon192; document.head.appendChild(apple);

  const swJS = `
    const CACHE='rocky-hsc-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./','./index.html']).catch(()=>{})));
    });
    self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch', e => {
      e.respondWith(
        fetch(e.request).then(res => {
          const copy=res.clone();
          caches.open(CACHE).then(c => { try{ c.put(e.request, copy); }catch(err){} });
          return res;
        }).catch(() => caches.match(e.request).then(r => r || caches.match('./') || caches.match('./index.html')))
      );
    });
  `;
  if("serviceWorker" in navigator){
    try{
      const swUrl=URL.createObjectURL(new Blob([swJS],{type:"application/javascript"}));
      await navigator.serviceWorker.register(swUrl,{scope:"./"});
    }catch(err){
      try{
        await navigator.serviceWorker.register("data:application/javascript,"+encodeURIComponent(swJS));
      }catch(e2){}
    }
  }
}
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; });
  } else {
    const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    toast(isiOS? "Safari Share → Add to Home Screen চাপুন":"ব্রাউজার মেনু থেকে Add to Home Screen / Install app বেছে নিন");
  }
}
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; });

setupPWA();
render(true);
})();
</script>
