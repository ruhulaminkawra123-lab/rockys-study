<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rocky HSC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="রকির AI স্টাডি গাইডার — HSC 2027 মানবিক, বগুড়া। অধ্যায় ট্র্যাকার, রুটিন, টাইমার ও অ্যানালিটিক্স।">
<title>রকির AI স্টাডি গাইডার · HSC 2027</title>
<style>
:root{
  --bg:#070b14;--card:rgba(16,22,40,.92);--stroke:rgba(255,255,255,.1);
  --text:#eef2ff;--muted:#8b9bb4;--accent:#818cf8;--cyan:#22d3ee;--gold:#f59e0b;
  --gold2:#fde047;--ok:#34d399;--danger:#f87171;--pink:#f472b6;
  --nav-h:74px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Nirmala UI","Kalpurush",system-ui,sans-serif;
  overflow-x:hidden}
body{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px);padding-top:env(safe-area-inset-top,0px)}
/* GPU-Friendly Static Ambient Glow (No expensive blur filter or infinite repaint) */
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(circle at 10% 10%, rgba(79,70,229,.22) 0%, transparent 45%),
    radial-gradient(circle at 90% 80%, rgba(8,145,178,.2) 0%, transparent 45%),
    radial-gradient(circle at 30% 70%, rgba(124,58,237,.14) 0%, transparent 40%);
}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 14px 20px}
@media(min-width:900px){#app{max-width:980px;padding:18px 22px}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#22d3ee);display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.brand h1{font-size:15.5px;font-weight:800;letter-spacing:.2px;line-height:1.2}
.brand p{font-size:11px;color:var(--muted)}
.install-btn{border:0;cursor:pointer;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;padding:9px 12px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 14px rgba(79,70,229,.3)}
/* Lag-Free Glass Card: Rich gradient without heavy backdrop-filter on every card */
.glass{background:linear-gradient(145deg,rgba(24,33,58,.94),rgba(13,19,36,.96));border:1px solid var(--stroke);border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.page.anim{animation:up .22s ease-out}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cd-wrap{padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.cd-wrap::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;background:radial-gradient(circle,rgba(253,224,71,.15),transparent 70%)}
.cd-label{font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd-cell{text-align:center;background:rgba(0,0,0,.32);border-radius:14px;padding:10px 4px;border:1px solid rgba(255,255,255,.06)}
.cd-num{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.cd-unit{font-size:10px;color:var(--muted);margin-top:3px}
.quote-banner{padding:14px 16px;margin-bottom:12px;cursor:pointer;position:relative}
.quote-banner q{font-size:13.5px;line-height:1.65;font-style:italic;color:#dbe4ff;quotes:none;transition:opacity .25s ease}
.quote-banner .who{margin-top:8px;font-size:11px;color:var(--gold);font-weight:700;transition:opacity .25s ease}
.quote-banner .hint{margin-top:4px;font-size:10px;color:var(--muted);transition:opacity .25s ease}
.quote-banner.q-hide q,.quote-banner.q-hide .who,.quote-banner.q-hide .hint{opacity:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;color:#c7d2fe}
.stat span{font-size:10.5px;color:var(--muted);line-height:1.3}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 8px}
.section-h h2{font-size:14px;font-weight:800}
.chip{font-size:10.5px;padding:4px 9px;border-radius:999px;background:rgba(129,140,248,.15);color:#c7d2fe;border:1px solid rgba(129,140,248,.25)}
.chip.gold{background:rgba(245,158,11,.15);color:#fde047;border-color:rgba(245,158,11,.3)}
.chip.ok{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:rgba(52,211,153,.25)}
.sub-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sub-card{padding:12px}
.sub-card .k{font-size:10px;color:var(--muted)}
.sub-card .n{font-size:13px;font-weight:800;margin:4px 0 8px;line-height:1.35}
.bar-bg{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.bar-fg{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--cyan));width:0;transition:width .4s ease}
.sess{padding:12px 14px;margin-bottom:8px}
.sess-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sess-meta{font-size:10.5px;color:var(--cyan);font-weight:700}
.sess h3{font-size:13px;margin:3px 0 2px}
.sess .ch-t{font-size:13.5px;line-height:1.45;color:#e0e7ff}
.done-btn{border:0;cursor:pointer;background:linear-gradient(135deg,#059669,#34d399);color:#052e1c;font-weight:800;font-size:11px;padding:8px 10px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.done-btn.off{background:rgba(255,255,255,.08);color:var(--muted)}
.pace{padding:12px 14px;margin-top:4px;font-size:12.5px;line-height:1.55;color:#cbd5e1}
.routine-item{display:flex;gap:10px;padding:12px;margin-bottom:8px;align-items:flex-start;cursor:pointer}
.routine-item.now{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 1px rgba(34,211,238,.25)}
.routine-item.done{opacity:.6}
.check{width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.25);flex-shrink:0;margin-top:2px;display:grid;place-items:center;background:rgba(255,255,255,.04)}
.check.on{background:linear-gradient(135deg,#059669,#34d399);border-color:transparent;color:#052e1c;font-weight:900}
.rt-time{font-size:11px;color:var(--cyan);font-weight:700}
.rt-title{font-size:13.5px;font-weight:700;line-height:1.4;margin:2px 0}
.rt-sub{font-size:11.5px;color:var(--muted);line-height:1.45}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;margin-top:4px;font-weight:700}
.tag.hsc{background:rgba(129,140,248,.18);color:#c7d2fe}
.tag.code{background:rgba(52,211,153,.15);color:#6ee7b7}
.tag.en{background:rgba(244,114,182,.15);color:#f9a8d4}
.tag.life{background:rgba(251,191,36,.12);color:#fde68a}
.acc{margin-bottom:8px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.acc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.acc-h b{flex:1;font-size:13.5px;line-height:1.3}
.acc-h em{font-style:normal;font-size:11px;color:var(--muted)}
.acc-b{display:none;padding:0 10px 12px}
.acc.open .acc-b{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:8px 6px;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px;line-height:1.45;cursor:pointer}
.ch-row .mini{width:18px;height:18px;border-radius:5px;border:2px solid rgba(255,255,255,.2);flex-shrink:0;margin-top:1px;display:grid;place-items:center;font-size:11px}
.ch-row.on{color:#86efac}
.ch-row.on .mini{background:#34d399;border-color:transparent;color:#052e1c}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(12,18,34,.9);color:var(--text);margin-bottom:10px;font-size:13.5px;outline:none}
/* ===== Timer (merged engine) ===== */
.timer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tbtn{padding:10px 6px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--text);border-radius:14px;cursor:pointer;font-size:11.5px;font-weight:700;text-align:center;font-family:inherit}
.tbtn.on{background:linear-gradient(135deg,#4f46e5,#6366f1);border-color:transparent;box-shadow:0 4px 14px rgba(79,70,229,.35)}
.tbtn small{display:block;font-weight:600;color:var(--muted);font-size:10px;margin-top:3px}
.tbtn.on small{color:#c7d2fe}
.cust{display:none;grid-template-columns:1fr 1fr;gap:10px;padding:12px;margin-bottom:12px}
.cust.show{display:grid}
.cust label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--stroke);background:rgba(0,0,0,.35);color:var(--text);font-size:15px;font-weight:700;outline:none;font-family:inherit}
.in:focus{border-color:rgba(129,140,248,.7)}
select.in{font-size:13px;font-weight:600}
select.in option{background:#0f172a;color:#eef2ff}
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:16px 12px 14px;margin-bottom:12px}
.tm-phase{font-size:12.5px;font-weight:800;color:var(--cyan);margin-bottom:8px}
.ring-box{position:relative;width:220px;height:220px}
.ring-wrap svg{width:220px;height:220px;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 30px;text-align:center}
.time-big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.1}
.tm-cur{font-size:12px;font-weight:800;line-height:1.3;margin-top:4px;max-width:150px}
.t-actions{display:flex;gap:8px;justify-content:center;margin:12px 0 0;flex-wrap:wrap;width:100%}
.btn{border:0;cursor:pointer;border-radius:12px;padding:11px 16px;font-weight:800;font-size:13px;font-family:inherit;color:var(--text)}
.btn:active{transform:scale(.97)}
.btn.go{background:linear-gradient(135deg,#4f46e5,#22d3ee);color:#fff}
.btn.pause{background:rgba(251,191,36,.2);color:#fde047}
.btn.save{background:linear-gradient(135deg,#f59e0b,#fde047);color:#3b2606}
.btn.skip{background:rgba(255,255,255,.08)}
.btn.tog{background:rgba(255,255,255,.06);border:1px solid var(--stroke);width:100%}
.btn.tog.on{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.5);color:#67e8f9}
.btn.plain{background:rgba(255,255,255,.07);border:1px solid var(--stroke)}
.ring-wrap.brk .tm-phase,.ring-wrap.brk .time-big{color:var(--gold2)}
.ring-wrap.brk .btn.go{background:linear-gradient(135deg,#f59e0b,#fde047);color:#3b2606}
.tm-prog{width:100%;margin-top:14px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sbtn{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-family:inherit}
.sbtn.on{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.12)}
.sbtn .k{font-size:10px;color:var(--muted)}
.sbtn b{font-size:12.5px;line-height:1.3}
.sbtn small{font-size:11px;color:var(--cyan);font-variant-numeric:tabular-nums}
.sbtn:only-child{grid-column:1/-1}
.sub-box{padding:14px;margin-bottom:12px}
/* ===== Analytics (merged engine) ===== */
.an-card{padding:14px;margin-bottom:12px}
.an-card h2{font-size:14px;font-weight:800;margin-bottom:10px}
.stat.t b{font-size:17px;font-variant-numeric:tabular-nums}
.stat.t:first-child b{color:var(--ok)}
.tbar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.tbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .4s}
.tbar>i.ok{background:var(--ok)}
.wgoal{position:relative;height:18px;border-radius:99px;background:rgba(0,0,0,.35) repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 1px),rgba(255,255,255,.1) calc(12.5% - 1px) 12.5%);border:1px solid var(--stroke);overflow:hidden}
.wgoal>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .4s;opacity:.92}
.wgoal>i.ok{background:var(--ok)}
.wgoal>u{position:absolute;top:0;bottom:0;left:87.5%;width:2px;background:var(--gold)}
.gl{position:relative;height:16px;margin-top:4px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gl span{position:absolute;top:0;white-space:nowrap}
.gl span:nth-child(1){left:0}
.gl span:nth-child(2){left:87.5%;transform:translateX(-50%);color:var(--gold2)}
.gl span:nth-child(3){right:0}
.status{margin-top:10px;display:inline-block;padding:4px 12px;border-radius:99px;font-weight:800;font-size:13px;border:1px solid}
.scroll{max-height:340px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.li{display:grid;grid-template-columns:100px 1fr 64px;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:12.5px}
.li:last-child{border:0}
.li .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.li.hit .n{color:var(--ok)}
.sj-row{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.sj-row:last-child{border:0}
.sj-row .tbar{margin:5px 0 7px}
.sj-row .n{font-variant-numeric:tabular-nums;font-weight:700}
.bk-row{display:flex;gap:8px;flex-wrap:wrap}
.bk-row .btn{flex:1;min-width:150px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 10px calc(8px + var(--safe-b));background:linear-gradient(180deg,transparent,rgba(7,11,20,.95) 35%);pointer-events:none}
.nav-in{pointer-events:auto;display:flex;width:100%;max-width:560px;background:rgba(14,20,38,.96);border:1px solid var(--stroke);border-radius:20px;padding:6px;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.nav-btn{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 2px 6px;border-radius:14px;cursor:pointer;font-size:10px;font-weight:700}
.nav-btn svg{display:block;margin:0 auto 3px}
.nav-btn.on{color:#fff;background:rgba(129,140,248,.2)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translateX(-50%) translateY(20px);background:#0f172a;border:1px solid rgba(52,211,153,.4);color:#d1fae5;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.25s;z-index:50;max-width:90%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.goal{padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.goal b{color:var(--gold2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px;margin-bottom:12px}
.wday{text-align:center;padding:8px 2px;border-radius:10px;font-size:10px;background:rgba(255,255,255,.04);border:1px solid transparent}
.wday.on{border-color:rgba(129,140,248,.5);background:rgba(129,140,248,.18)}
.wday.fri{color:#fde047}
.wday b{display:block;font-size:11px;margin-bottom:3px}
.prog-ring-sm{width:44px;height:44px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
hr.sep{border:0;border-top:1px solid rgba(255,255,255,.06);margin:10px 0}
.manual-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.linkish{background:none;border:0;color:var(--accent);font-size:12px;cursor:pointer;font-weight:700}
@media(min-width:900px){
  .desk{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;align-items:start}
  .nav-in{max-width:980px}
}
</style>
</head>
<body>
<div class="orbs"></div>
<div id="app">
  <div class="topbar">

      <div class="logo">র</div>
      <div><h1>রকির AI স্টাডি গাইডার</h1><p>HSC 2027 · মানবিক · বগুড়া</p></div>

  <div id="pageView"></div>
  <div id="navView"></div>
</div>
<div id="toast" class="toast"></div>

/* ================= Study engine: drift-proof timer + second-level logs ================= */
const SKEY="rocky_st_v1";
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const HSC_SESS=["s1","s2","s3","s4","s5"];
const $=id=>document.getElementById(id);
const BASE_TITLE=document.title;
const num=v=>{v=Number(v);return isFinite(v)&&v>0?v:0};
const isBook=b=>Object.prototype.hasOwnProperty.call(SUBJECTS,b);
const isObj=o=>!!o&&typeof o==="object"&&!Array.isArray(o);
const dk=d=>{d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtHM=s=>Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m";

/* ---- Store ---- */
function normS(o){
  o=isObj(o)?o:{};
  const r={logs:{},cfg:{mode:"classic",cf:25,cb:5,wl:false},over:null,sync:{},timer:null};
  if(isObj(o.logs)){
    for(const d in o.logs){
      if(!DATE_RE.test(d)||!isObj(o.logs[d]))continue;
      const row={};
      for(const b in o.logs[d]){
        if(!(isBook(b)||b==="rev"))continue;
        const v=Math.floor(num(o.logs[d][b]));
        if(v)row[b]=v;
      }
      if(Object.keys(row).length)r.logs[d]=row;
    }
  }
  if(isObj(o.cfg)){
    const c=o.cfg;
    if(["classic","deep","custom"].includes(c.mode))r.cfg.mode=c.mode;
    r.cfg.cf=Math.min(240,Math.max(1,Math.round(num(c.cf))||25));
    r.cfg.cb=Math.min(60,Math.max(1,Math.round(num(c.cb))||5));
    r.cfg.wl=!!c.wl;
  }
  if(isObj(o.over)&&isBook(o.over.book)&&DATE_RE.test(String(o.over.date)))r.over={date:o.over.date,book:o.over.book};
  if(isObj(o.sync)){
    for(const d in o.sync){
      if(!DATE_RE.test(d)||!isObj(o.sync[d]))continue;
      const row={};
      HSC_SESS.forEach(id=>{if(o.sync[d][id])row[id]=true});
      r.sync[d]=row;
    }
  }
  if(isObj(o.timer))r.timer=o.timer;
  return r;
}
function loadS(){S=normS(load(SKEY,null))}
let storeWarned=false;
function saveS(){
  try{save(SKEY,S)}
  catch(e){if(!storeWarned){storeWarned=true;toast("⚠️ ডেটা সেভ হচ্ছে না — ব্রাউজার স্টোরেজ বন্ধ/পূর্ণ। এখনই ব্যাকআপ নাও।")}}
}

/* ---- Analytics helpers ---- */
const logSum=k=>{const l=S.logs[k];return l?Object.values(l).reduce((a,b)=>a+b,0):0};
/* routine-session credit & older hour logs (seconds). Day total = larger of the two, so nothing double counts */
const legacySecs=k=>Math.round(displayHours(k)*3600);
const dayTotal=k=>Math.max(logSum(k),legacySecs(k));
const rangeTotal=n=>{let s=0;const d=new Date();for(let i=0;i<n;i++)s+=dayTotal(dk(addDays(d,-i)));return s};
function streakCount(){
  let d=new Date();
  if(dayTotal(dk(d))<18000)d=addDays(d,-1);
  let c=0;
  while(c<2000&&dayTotal(dk(d))>=18000){c++;d=addDays(d,-1)}
  return c;
}
function addLog(book,secs){const k=dk();S.logs[k]=S.logs[k]||{};S.logs[k][book]=(S.logs[k][book]||0)+secs}

/* ---- Subject selection (linked to the 13 papers & today's plan) ---- */
function defaultBook(){const p=todayPlan();return nowMins()<795?p.m:p.a}
function activeBook(){return(S.over&&S.over.date===dk()&&isBook(S.over.book))?S.over.book:defaultBook()}

/* ---- Timer engine (timestamps, never decrements) ---- */
const fMs=()=>(S.cfg.mode==="classic"?25:S.cfg.mode==="deep"?50:S.cfg.cf)*60000;
const bMs=()=>(S.cfg.mode==="custom"?S.cfg.cb:5)*60000;
function initTimer(){
  const t=S.timer;
  T={phase:"focus",running:false,endAt:0,rem:fMs(),last:0,pend:0,sess:0};
  if(t&&(t.phase==="focus"||t.phase==="break")){
    T.phase=t.phase;T.running=!!t.running;T.endAt=num(t.endAt);
    T.rem=num(t.rem)||(t.phase==="focus"?fMs():bMs());
    T.last=num(t.last);T.pend=num(t.pend);T.sess=num(t.sess);
  }
  if(T.running&&!(T.endAt>0&&T.last>0))T.running=false;
}
function persistTimer(){S.timer=Object.assign({},T);saveS()}
function flushPend(){
  if(!T)return;
  if(T.running&&T.phase==="focus"){
    const now=Math.min(Date.now(),T.endAt);
    T.pend+=Math.max(0,now-T.last);T.last=now;
  }
  const s=Math.floor(T.pend/1000);
  if(s>0){
    T.pend-=s*1000;T.sess+=s;
    addLog(activeBook(),s);
    syncRoutine();
    persistTimer();
  }
}
/* Timer -> Routine: as today's timed study crosses each HSC session length (120/90/90/75/75 min), tick that routine step once */
function syncRoutine(){
  const t=dk(),tot=logSum(t);
  S.sync[t]=S.sync[t]||{};
  let cum=0;const names=[];
  HSC_SESS.forEach(id=>{
    const s=SESSIONS.find(x=>x.id===id);
    cum+=s.mins*60;
    if(tot>=cum&&!S.sync[t][id]){
      S.sync[t][id]=true;
      if(!routine[t])routine[t]={};
      if(!routine[t][s.step]){
        routine[t][s.step]=true;
        logSession(id,true);
        names.push(s.name);
      }
    }
  });
  if(names.length){
    persistRt();
    toast("✅ "+names.join(", ")+" রুটিনে অটো-টিক হয়েছে");
    if(page==="home"||page==="routine")render(false);
  }
}
let AC=null;
function actx(){
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
  }catch(e){}
  return AC;
}
function chime(){
  try{
    const c=actx();
    if(c){
      const notes=[784,988,1175,1568],t0=c.currentTime+.05;
      for(let r=0;r<3;r++)notes.forEach((f,i)=>{
        const t=t0+r*1.2+i*.18,o=c.createOscillator(),g=c.createGain();
        o.type="sine";o.frequency.value=f;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.35,t+.02);
        g.gain.exponentialRampToValueAtTime(.0001,t+.9);
        o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+1);
      });
    }
    if(navigator.vibrate)navigator.vibrate([300,150,300,150,600]);
  }catch(e){}
}
function phaseEnd(loud){
  if(T.phase==="focus"){
    flushPend();T.pend=0;
    const st=Math.min(Date.now(),T.endAt);           /* break starts when focus really ended */
    T.phase="break";T.rem=bMs();T.endAt=st+T.rem;T.last=st;T.running=true;
    if(loud){chime();toast("🎉 ফোকাস শেষ! এবার "+Math.round(T.rem/60000)+" মিনিট বিরতি নাও।")}
  }else{
    T.phase="focus";T.rem=fMs();T.running=false;T.endAt=0;T.last=0;T.sess=0;
    if(loud){chime();toast("☕ বিরতি শেষ! আবার শুরু করো।")}
    relWL();
  }
  persistTimer();
}
function tick(){
  if(T&&T.running){
    if(T.phase==="focus")flushPend();
    let guard=0;
    while(T.running&&Date.now()>=T.endAt&&guard++<3)phaseEnd(Date.now()-T.endAt<8000);
  }
  paintTitle();
  if(page==="timer")paintTimer();
  const sig=Math.floor(dayTotal(dk())/60);
  if(sig!==lastMin){
    lastMin=sig;
    if(page==="timer")paintToday();
    else if(page==="analytics")refreshAnalytics();
  }
}
function startT(){
  actx();
  if(T.running)return;
  const now=Date.now();
  T.endAt=now+T.rem;T.last=now;T.running=true;
  persistTimer();reqWL();paintTimer();
}
function pauseT(){
  if(!T.running)return;
  flushPend();
  T.rem=Math.max(1000,T.endAt-Date.now());T.running=false;
  persistTimer();paintTimer();
}
function saveStop(){
  if(T.running)flushPend();
  const ss=T.sess;
  T.phase="focus";T.running=false;T.endAt=0;T.last=0;T.pend=0;T.rem=fMs();T.sess=0;
  persistTimer();relWL();paintTimer();
  toast(ss>0?"💾 "+Math.floor(ss/60)+" মি "+(ss%60)+" সে সেভ হয়েছে ✔":"টাইমার রিসেট হয়েছে");
}
function skipBreak(){
  T.phase="focus";T.rem=fMs();T.running=false;T.endAt=0;T.last=0;T.sess=0;
  persistTimer();relWL();paintTimer();
}
function timerLocked(){return T.running||(T.phase==="break"&&T.endAt>0)}
function setMode(m){
  if(timerLocked()){toast("আগে বর্তমান সেশন থামাও");return}
  S.cfg.mode=m;T.phase="focus";T.rem=fMs();T.sess=0;
  persistTimer();paintTimer();
}
function applyCustom(){
  const cf=$("tmCf"),cb=$("tmCb");
  if(!cf||!cb)return;
  if(timerLocked()){toast("আগে বর্তমান সেশন থামাও");cf.value=S.cfg.cf;cb.value=S.cfg.cb;return}
  S.cfg.cf=Math.min(240,Math.max(1,Math.round(num(cf.value))||25));
  S.cfg.cb=Math.min(60,Math.max(1,Math.round(num(cb.value))||5));
  cf.value=S.cfg.cf;cb.value=S.cfg.cb;
  if(T.phase==="focus")T.rem=fMs();

}
function remNow(){return T.running?Math.max(0,T.endAt-Date.now()):T.rem}
function paintTitle(){
  if(T&&T.running){const s=Math.ceil(remNow()/1000);document.title=pad(Math.floor(s/60))+":"+pad(s%60)+" • "+BASE_TITLE}

let wlk=null;
async function reqWL(){
  if(!S.cfg.wl||!T.running||!("wakeLock" in navigator))return;
  try{if(!wlk||wlk.released)wlk=await navigator.wakeLock.request("screen")}catch(e){}
}
function relWL(){try{if(wlk){wlk.release();wlk=null}}catch(e){}}
function toggleWL(){
  if(!("wakeLock" in navigator)){toast("এই ব্রাউজারে স্ক্রিন-অন সাপোর্ট নেই");return}

function exportBackup(){
  flushPend();
  try{
    const study=Object.assign({},S,{timer:null});
    const payload={app:"rocky-hsc-study",v:2,exported:new Date().toISOString(),
      data:{chapters,routine,hours,logged,manual,partials,study}};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="rocky-hsc-backup-"+dk()+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("✅ ব্যাকআপ ডাউনলোড হয়েছে");
  }catch(e){toast("ব্যাকআপ তৈরি করা যায়নি")}
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),d=isObj(j)&&isObj(j.data)?j.data:j;
      if(!isObj(d))throw 0;
      /* accepts this app's backup and the older standalone timer backup ({logs,cfg,...}) */
      const study=isObj(d.study)?d.study:(isObj(d.logs)?d:null);
      const known=study||isObj(d.chapters)||isObj(d.routine)||isObj(d.hours)||isObj(d.logged);
      if(!known)throw 0;
      if(!confirm("বর্তমান সব ডেটা এই ব্যাকআপ দিয়ে প্রতিস্থাপন করবে। চালিয়ে যাবে?"))return;
      relWL();
      if(isObj(d.chapters)){chapters={};for(const k in d.chapters)if(d.chapters[k])chapters[k]=true}
      if(isObj(d.routine))routine=d.routine;
      if(isObj(d.hours))hours=d.hours;
      if(isObj(d.logged))logged=d.logged;
      if(isObj(d.manual))manual=d.manual;
      if(isObj(d.partials))partials=d.partials;
      if(study){S=normS(study);S.timer=null}
      persistCh();persistRt();persistHr();saveS();
      initTimer();lastMin=-1;render(false);
      toast("✅ ব্যাকআপ রিস্টোর হয়েছে");
    }catch(e){toast("❌ ফাইলটি সঠিক ব্যাকআপ নয়")}
  };
  r.onerror=()=>toast("ফাইল পড়া যায়নি");
  r.readAsText(file);
}

}

function paintToday(){
  const chip=$("tmToday");
  if(!chip)return;
  const t=dk(),tot=dayTotal(t),tl=S.logs[t]||{};
  chip.textContent="আজ "+fmtHM(tot);
  const tx=$("tmTodayTxt"),bar=$("tmTodayBar");
  if(tx)tx.textContent=Math.floor(tot/60)+" / ৩০০ মি";
  if(bar){bar.style.width=Math.min(100,tot/180)+"%";bar.className=tot>=18000?"ok":""}
  document.querySelectorAll("#tmSubs small[id^=tmS_]").forEach(el=>{el.textContent="আজ "+fmtHM(tl[el.id.slice(4)]||0)});
}

function paintTimer(){
  const clock=$("tmClock");
  if(!clock||page!=="timer")return;
  const brk=T.phase==="break",total=brk?bMs():fMs(),rem=remNow();
  const sec=Math.ceil(rem/1000);
  clock.textContent=pad(Math.floor(sec/60))+":"+pad(sec%60);
  const ring=$("tmRing"),circ=2*Math.PI*96;
  ring.style.strokeDashoffset=String(circ*(1-Math.min(1,Math.max(0,rem/total))));
  ring.setAttribute("stroke",brk?"url(#tgb)":"url(#tg)");
  $("tmBox").classList.toggle("brk",brk);
  $("tmPhase").textContent=brk?"☕ বিরতির সময়":(T.running?"🎯 ফোকাস চলছে":"ফোকাস সেশন");
  const go=$("tmGo");
  go.textContent=T.running?"⏸ বিরতি দাও":(T.rem<total?"▶ চালিয়ে যাও":"▶ শুরু করো");
  go.className="btn "+(T.running?"pause":"go");
  $("tmSkip").style.display=brk?"":"none";
  const act=activeBook(),cur=$("tmCur");
  cur.textContent=SUBJECTS[act].bn;cur.style.color=SUBJECTS[act].color;
  document.querySelectorAll("#tmModes .tbtn").forEach(b=>b.classList.toggle("on",b.dataset.m===S.cfg.mode));
  $("tmCust").classList.toggle("show",S.cfg.mode==="custom");
  document.querySelectorAll("#tmSubs .sbtn").forEach(b=>b.classList.toggle("on",b.dataset.b===act));
  const sel=$("tmSel");if(sel&&sel.value!==act)sel.value=act;
  const wl=$("tmWl");
  wl.classList.toggle("on",!!S.cfg.wl);
  wl.textContent="📱 স্ক্রিন চালু রাখো: "+(S.cfg.wl?"চালু":"বন্ধ");
  paintToday();
}

/* ================= Analytics ================= */
function weekInfo(){
  const td=new Date();td.setHours(0,0,0,0);
  const idx=(td.getDay()+1)%7;                 /* Saturday = 0 ... Friday = 6 */
  let w=0;for(let i=0;i<=idx;i++)w+=dayTotal(dk(addDays(td,-i)));
  const H=w/3600,n=new Date();
  const ds=idx+(n.getHours()*60+n.getMinutes())/1440,proj=H/Math.max(ds,.5)*7;
  let txt,col;
  if(H>=80){txt="🏆 Elite Target Achieved!";col="var(--ok)"}
  else if(H>=70){txt="✅ Minimum Goal Hit — push for 80h!";col="var(--ok)"}
  else if(proj>=80){txt="On Track for 80h! 🚀";col="var(--ok)"}
  else if(proj>=70){txt="On Track for 70h 👍";col="var(--cyan)"}
  else{txt="Behind Pace — গতি বাড়াও! ⚡";col="var(--gold)"}
  return {w,H,txt,col};
}

    <div class="wgoal"><i class="${H>=70?"ok":""}" style="width:${Math.min(100,wk.w/288000*100)}%"></i><u></u></div>
    <div class="gl"><span>0h</span><span>70h (মিনিমাম)</span><span>80h</span></div>
    <div class="small muted" style="margin-top:8px;line-height:1.55">সম্পন্ন ${H.toFixed(1)}h (৭০ঘ-এর ${(H/70*100).toFixed(1)}% • ৮০ঘ-এর ${(H/80*100).toFixed(1)}%) • ৭০ঘ-এ পৌঁছাতে ${Math.max(0,70-H).toFixed(1)}h, ৮০ঘ-এ ${Math.max(0,80-H).toFixed(1)}h বাকি · সপ্তাহ শনি–শুক্র</div>
    <span class="status" style="color:${wk.col};border-color:${wk.col}">${wk.txt}</span>
  </div>`;
}
function anDailyHTML(){
  const td=new Date(),rows=[];let mx=18000;
  for(let i=0;i<30;i++){const d=addDays(td,-i),v=dayTotal(dk(d));rows.push([d,v]);mx=Math.max(mx,v)}
  return rows.map(([d,v])=>{
    let lb;try{lb=d.toLocaleDateString("bn-BD",{weekday:"short",day:"numeric",month:"short"})}catch(e){lb=dk(d)}
    const hit=v>=18000;
    return `<div class="li ${hit?"hit":""}"><span>${lb}</span><div class="tbar"><i class="${hit?"ok":""}" style="width:${v/mx*100}%"></i></div><span class="n">${fmtHM(v)}</span></div>`;
  }).join("");
}
function anSubjHTML(){
  const tot={};let unatt=0;
  const dates=new Set([...Object.keys(S.logs),...Object.keys(hours),...Object.keys(partials),...Object.keys(manual)]);
  dates.forEach(d=>{
    const l=S.logs[d]||{};
    for(const b in l)tot[b]=(tot[b]||0)+l[b];
    unatt+=Math.max(0,dayTotal(d)-logSum(d));
  });
  const smx=Math.max(3600,...SUB_ORDER.map(id=>tot[id]||0));
  let html=SUB_ORDER.map(id=>{
    const s=SUBJECTS[id],v=tot[id]||0,d=doneCount(id),n=s.chapters.length,p=Math.round(d/n*100);
    return `<div class="sj-row">
      <div class="row-between small"><span style="color:${s.color};font-weight:800">${s.bn}</span><span class="n">⏱ ${fmtHM(v)}</span></div>
      <div class="tbar"><i style="width:${v/smx*100}%;background:${s.color}"></i></div>
      <div class="row-between small muted"><span>✅ অধ্যায় ${d}/${n}</span><span>${p}%</span></div>
      <div class="bar-bg" style="margin-top:4px"><div class="bar-fg" style="width:${p}%;background:${s.color}"></div></div>
    </div>`;
  }).join("");
  const rev=tot.rev||0;
  if(rev>0)html+=`<div class="sj-row"><div class="row-between small"><span>সাপ্তাহিক রিভিশন (পুরোনো লগ)</span><span class="n">⏱ ${fmtHM(rev)}</span></div></div>`;
  if(unatt>=60)html+=`<div class="sj-row"><div class="row-between small"><span>বিষয় ছাড়া (রুটিন টিক / পুরোনো ঘণ্টা)</span><span class="n">⏱ ${fmtHM(unatt)}</span></div></div>`;
  return html;
}

  return `<div class="section-h" style="margin-top:4px"><h2>📊 অ্যানালিটিক্স ও রিপোর্ট</h2><span class="chip ok">অধ্যায় ${Math.round(done/tot*100)}%</span></div>

    <q>${q.q}</q>

function refreshAnalytics(){
  const top=$("anTop"),dl=$("anDl"),sj=$("anSj");

  const a=dl.scrollTop,b=sj.scrollTop;

function navBar(){
  const items=[["home","হোম","home"],["routine","রুটিন","list"],["syllabus","সিলেবাস","book"],["timer","টাইমার","timer"],["analytics","চার্ট","chart"]];
  return `<nav class="nav"><div class="nav-in">${items.map(i=>`<button class="nav-btn ${page===i[0]?"on":""}" data-act="nav" data-p="${i[0]}">${svgI(i[2])}${i[1]}</button>`).join("")}</div></nav>`;
}

function render(animate){
  const pages={home:renderHome, routine:renderRoutine, syllabus:renderSyllabus, timer:renderTimer, analytics:renderAnalytics};
  const pv=document.getElementById("pageView");
  const nv=document.getElementById("navView");
  pv.className = animate ? "page anim" : "page";
  pv.innerHTML = pages[page]();
  nv.innerHTML = navBar();
  if(page==="timer") paintTimer();

  const sy=document.getElementById("sySearch");
  if(sy){
    sy.addEventListener("input", e=>{
      syFilter=e.target.value;
      const box=document.getElementById("syListContainer");
      if(box) box.innerHTML=renderSyList();
    });
    sy.addEventListener("keydown", e=>{ if(e.key==="Escape"){ syFilter=""; sy.value=""; const box=document.getElementById("syListContainer"); if(box) box.innerHTML=renderSyList(); } });

document.getElementById("app").addEventListener("click", e=>{
  const b=e.target.closest("[data-act]");
  if(!b) return;
  const act=b.dataset.act;
  if(act==="nav"){ page=b.dataset.p; window.scrollTo(0,0); render(true); }
  else if(act==="donech") markChapter(b.dataset.id, true);
  else if(act==="ch"){ toggleChapter(b.dataset.id, true); refreshSyList(); }
  else if(act==="rt") toggleRoutine(Number(b.dataset.i));
  else if(act==="acc"){
    openSub = openSub===b.dataset.id? null : b.dataset.id;
    refreshSyList();
  }
  else if(act==="nextq"){ quoteIdx=(quoteIdx+1)%QUOTES.length; updateQuoteDOM(); }
  else if(act==="tmmode") setMode(b.dataset.m);
  else if(act==="tmgo"){ if(T.running) pauseT(); else startT(); }
  else if(act==="tmstop") saveStop();
  else if(act==="tmskip") skipBreak();
  else if(act==="setbook") setBook(b.dataset.b);
  else if(act==="wl") toggleWL();
  else if(act==="exp") exportBackup();
  else if(act==="imp"){ const f=$("impFile"); if(f) f.click(); }
  else if(act==="install") installApp();
  else if(act==="reset"){
    if(confirm("সব অধ্যায়, রুটিন, টাইমার ও পড়ার লগ মুছে যাবে। নিশ্চিত?")){
      chapters={}; routine={}; hours={}; logged={}; manual={}; partials={};
      relWL(); S=normS({cfg:S.cfg}); initTimer(); saveS();
      persistCh(); persistRt(); persistHr(); toast("রিসেট সম্পন্ন"); render(false);
    }
  }
});

setInterval(()=>{
  const r=fmtRemain();
  const d=document.getElementById("cdD");
  if(d){ d.textContent=r.d; document.getElementById("cdH").textContent=pad(r.h); document.getElementById("cdM").textContent=pad(r.m); document.getElementById("cdS").textContent=pad(r.s); }
},1000);
setInterval(()=>{ quoteIdx=(quoteIdx+1)%QUOTES.length; updateQuoteDOM(); }, 14000);

function generateIcon(size){
  const c=document.createElement("canvas"); c.width=c.height=size;
  const ctx=c.getContext("2d");
  const g=ctx.createLinearGradient(0,0,size,size);
  g.addColorStop(0,"#4338ca"); g.addColorStop(1,"#0891b2");
  ctx.fillStyle=g;
  const r=size*0.22;
  ctx.beginPath();
  ctx.moveTo(r,0); ctx.arcTo(size,0,size,size,r); ctx.arcTo(size,size,0,size,r); ctx.arcTo(0,size,0,0,r); ctx.arcTo(0,0,size,0,r);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=`800 ${size*0.42}px system-ui,sans-serif`;
  ctx.fillText("R", size/2, size/2 - size*0.04);
  ctx.font=`700 ${size*0.12}px system-ui`;
  ctx.fillStyle="#c7d2fe";
  ctx.fillText("HSC 27", size/2, size/2 + size*0.28);
  return c.toDataURL("image/png");
}

async function setupPWA(){
  const icon192=generateIcon(192), icon512=generateIcon(512);
  const manifest={
    name:"রকির AI স্টাডি গাইডার",
    short_name:"Rocky HSC",
    description:"HSC 2027 Humanities study guider & analytics for Rocky, Bogura.",
    start_url:location.origin+location.pathname,
    scope:location.origin+location.pathname.replace(/[^/]*$/,""),
    display:"standalone",
    orientation:"portrait",
    background_color:"#070b14",
    theme_color:"#4f46e5",
    lang:"bn-BD",
    icons:[
      {src:icon192,sizes:"192x192",type:"image/png",purpose:"any maskable"},
      {src:icon512,sizes:"512x512",type:"image/png",purpose:"any maskable"}
    ]
  };
  const mUrl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"}));
  const link=document.createElement("link"); link.rel="manifest"; link.href=mUrl; document.head.appendChild(link);
  const apple=document.createElement("link"); apple.rel="apple-touch-icon"; apple.href=icon192; document.head.appendChild(apple);

  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    try{ await navigator.serviceWorker.register("sw.js"); }catch(err){}
  }
}
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; });
  } else {
    const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    toast(isiOS? "Safari Share → Add to Home Screen চাপুন":"ব্রাউজার মেনু থেকে Add to Home Screen / Install app বেছে নিন");
  }
}
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; });

/* ---- change events (select / custom inputs / file import) ---- */
document.getElementById("app").addEventListener("change", e=>{
  const id=e.target.id;
  if(id==="tmSel") setBook(e.target.value);
  else if(id==="tmCf"||id==="tmCb") applyCustom();
  else if(id==="impFile"){ const f=e.target.files[0]; if(f) importBackup(f); e.target.value=""; }
});
/* ---- lifecycle: never lose seconds when the screen locks / app is backgrounded ---- */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible"){ tick(); reqWL(); }
  else { flushPend(); persistTimer(); }
});
window.addEventListener("pagehide", ()=>{ flushPend(); persistTimer(); });

loadS(); initTimer();
setupPWA();
render(true);
tick();
setInterval(tick, 500);
})();
